[package]
name = "fluxcore"
version = "1.0.0"
edition = "2024"
authors = ["Austin Bennett <theaustinbennett@gmail.com>"]
description = "A rust library that provides similar functionality to GNU-tar"
license = "MIT"
repository = "https://github.com/Austin-Bennett/flux"
documentation = "todo"
readme = "README.md"
keywords = ["archive", "tar", "compression", "backup"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
lazy_static = "1.5.0"
chrono = "0.4.42"
libc = "1.0.0-alpha.1"
crc64 = "2.0.0"
crossterm = "0.29.0"
filetime = "0.2.26"
nix = { version = "0.30.1", features = ["fs", "user"] }
zstd = "0.13.3"